name: Build the site

# Runs whenever you edit the data, templates or styles on main,
# or by hand with the "Run workflow" button in the Actions tab.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/**
      - templates/**
      - static/**
      - scripts/**
      - site.yaml

permissions:
  contents: write              # save the rebuilt site
  issues: write                # open an issue if the build breaks

concurrency:
  group: gd-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check the data files
        run: python scripts/validate.py

      - name: Build the site (published issues only)
        run: python scripts/build.py

      - name: Save changes
        run: |
          git config user.name  "gd-index-bot"
          git config user.email "gd-index-bot@users.noreply.github.com"
          git add docs
          git commit -m "Rebuild site $(date -u +%F)" || echo "Nothing to commit"
          git pull --rebase --autostash && git push

      - name: Tell Ezra if the build broke
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create gd-alert --color B60205 --description "Needs a look" 2>/dev/null || true
          gh issue create --title "G&D Index: the site build failed" --label gd-alert \
            --body "The build failed, so the live site was not changed. Usually a typo in a data file. Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
